<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivial 2.0</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="src/main.js"></script>
</head>
<body>
  <!-- Start Screen -->
  <section id="start-screen" class="screen active">
    <h1>Trivial 2.0</h1>
    <p>A local party game</p>
    <button id="start-btn">Start Game</button>
  </section>

    <!-- Main Game Screen -->
    <section id="game-screen" class="screen">
    <div id="game-container">
        <div id="question-panel" class="panel">
        <h2>Question Panel</h2>
        <label for="category-select">Category:</label>
        <select id="category-select">
            <option value="history">History</option>
            <option value="geography">Geography</option>
            <option value="science">Science</option>
        </select>
        <button id="show-question-btn">Show Question</button>

        <div id="question-area" class="hidden">
            <p id="question-text"></p>
            <button id="show-answer-btn">Show Answer</button>
            <p id="answer-text" class="hidden"></p>

            <!-- Timer UI -->
            <div id="timer-container">
            <svg id="timer-svg" viewBox="0 0 100 100">
                <circle id="timer-bg" cx="50" cy="50" r="45" />
                <circle id="timer-progress" cx="50" cy="50" r="45" />
            </svg>
            <div id="timer-text">00</div>
            </div>

            <div id="timer-controls">
            <label for="timer-duration">Duration (sec):</label>
            <input type="number" id="timer-duration" min="5" max="300" value="30">
            <button id="start-timer-btn">Start Timer</button>
            </div>
        </div>
        </div>

        <div id="scoreboard-panel" class="panel">
        <h2>Scoreboard</h2>
        <ul id="player-list"></ul>
        <input type="text" id="new-player-name" placeholder="Add player" />
        <button id="add-player-btn">Add</button>
        </div>
    </div>

    <button id="show-winner-btn">End Game</button>
    <button id="reset-game-btn">Reset Game</button>
    </section>


  <!-- Winner Screen -->
  <section id="winner-screen" class="screen">
    <h1>The Winner Is...</h1>
    <p id="winner-name">TBD</p>
    <button id="restart-btn">Restart</button>
  </section>
</body>
</html>
