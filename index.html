<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivial 2.0</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="src/main.js"></script>
</head>
<body>
  <!-- Start Screen -->
  <section id="start-screen" class="screen active">
    <h1>Trivial 2.0</h1>
    <p>Donde un juego se perdió, otro aparece</p>
    <button id="start-btn">Empieza el juego!</button>
  </section>

    <!-- Main Game Screen -->
    <section id="game-screen" class="screen">
    <div id="game-container">
        <div id="question-panel" class="panel">
        <h2>Panel de preguntas</h2>
        <label for="category-select">Categoría:</label>
        <select id="category-select">
            <option value="History">History</option>
            <option value="Geography">Geography</option>
            <option value="Science">Science</option>
        </select>
        <button id="show-question-btn">Mostrar pregunta</button>

        <div id="question-area" class="hidden">
            <p id="question-text"></p>
            <button id="show-answer-btn">Mostrar respuesta (si hay)</button>
            <p id="answer-text" class="hidden"></p>

            <!-- Timer UI -->
            <div id="timer-container">
            <svg id="timer-svg" viewBox="0 0 100 100">
                <circle id="timer-bg" cx="50" cy="50" r="45" />
                <circle id="timer-progress" cx="50" cy="50" r="45" />
            </svg>
            <div id="timer-text">00</div>
            </div>

            <div id="timer-controls">
            <label for="timer-duration">Duración (segundos):</label>
            <input type="number" id="timer-duration" min="5" max="300" value="30">
            <button id="start-timer-btn">Comenzar temporizador</button>
            </div>
        </div>
        </div>

        <div id="scoreboard-panel" class="panel">
        <h2>Mantisa</h2>
        <ul id="player-list"></ul>
        <input type="text" id="new-player-name-game" placeholder="Añadir jugador" />
        <button id="add-player-btn-game">Añadir</button>
        </div>

        <div id="category-legend" class="panel"></div>
    </div>

    <button id="show-winner-btn">Declarar ganador</button>
    <button id="reset-game-btn">Reiniciar el juego</button>
    </section>


  <!-- Winner Screen -->
  <section id="winner-screen" class="screen">
    <h1>Y el ganador es...</h1>
    <p id="winner-name">TBD</p>
    <button id="restart-btn">Pantalla de inicio</button>
  </section>
</body>
</html>
